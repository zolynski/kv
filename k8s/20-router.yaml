# The stateless tier.
#
# A plain Deployment, because nothing here is worth keeping: routers hold no data, so they can be
# scaled, rolled or killed freely. That is the entire payoff of separating the tiers - the part
# that must survive is small and never redeployed for a routing change.
apiVersion: v1
kind: Service
metadata:
  name: kv-router
  namespace: kv
  labels:
    app.kubernetes.io/name: kv-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kv-router
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-router
  namespace: kv
  labels:
    app.kubernetes.io/name: kv-router
    app.kubernetes.io/part-of: kv-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-router
  strategy:
    # No `type:` - RollingUpdate is the default, and the block below only means anything for it.
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv-router
        app.kubernetes.io/part-of: kv-store
    spec:
      # Paired with spring.lifecycle.timeout-per-shutdown-phase (15s) in the app's
      # application.yaml: the drain budget must expire before the kubelet's SIGKILL, or graceful
      # shutdown is a promise the platform does not keep.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: kv-router
          image: kv-router:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KV_ROUTER_SHARD_COUNT
              value: "3"          # must equal the StatefulSet's replica count
            # Stable per-pod DNS from the headless Service. No service discovery, no Kubernetes
            # API access, no RBAC: the addresses are derivable from the replica count alone,
            # which is precisely what a statically-sized cluster allows.
            - name: KV_ROUTER_SHARD_URL_TEMPLATE
              value: "http://kv-shard-{ordinal}.kv-shards.kv.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kv-router
  namespace: kv
spec:
  # Routers are interchangeable, but there must always be one. Shards get no PDB: each holds a
  # distinct third of the keyspace, so evicting any one of them loses data regardless of how many
  # others are up. That is a property of choosing no replication, and a budget cannot fix it.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-router
