spring:
  application:
    name: kv-shard
  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 15s

server:
  port: 8080
  shutdown: graceful

kv:
  store:
    implementation: chained
    max-entries: 1000000
  shard:
    ordinal: -1          # -1 = derive from the StatefulSet pod hostname
    count: 1
    enforce-ownership: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true    # exposes /actuator/health/{liveness,readiness} for Kubernetes
      show-details: always

logging:
  level:
    de.zolynski.kv: INFO
